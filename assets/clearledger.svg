<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title description"><title id="title">ClearLedger system architecture</title><desc id="description">HTTP and gRPC clients call Go ledger and payment services. PostgreSQL commits balanced journals, idempotency and the transactional outbox. Kafka delivers events to payment workers using a fake provider, while reconciliation compares provider records with journal history.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#222b43"/><stop offset=".52" stop-color="#192236"/><stop offset="1" stop-color="#131b2b"/></linearGradient><marker id="direction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8394bd" stroke-width="1.5"/></marker></defs><rect width="1440" height="620" fill="url(#background)"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="60" y="58" fill="#c9c3ff" font-size="25" letter-spacing="2">CLEARLEDGER</text><text x="60" y="112" fill="#f0f3ff" font-size="34" font-weight="600">Balanced journals. Recoverable payments.</text><path d="M460 236H520" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M720 292V380" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M920 436H980" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M1180 380V292" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M1180 292V336H260V380" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M460 436H520" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><g><rect x="60" y="180" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="260" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">HTTP / gRPC</text><text x="260" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Ledger + payment requests</text></g><g><rect x="520" y="180" width="400" height="112" rx="17" fill="#303958" stroke="#bcb5ff" stroke-width="2"/><text x="720" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Go services</text><text x="720" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Journals + payment states</text></g><g><rect x="980" y="180" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="1180" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Payment worker</text><text x="1180" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Idempotent fake provider</text></g><g><rect x="60" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="260" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Reconciliation</text><text x="260" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Persisted discrepancies</text></g><g><rect x="520" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="720" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">PostgreSQL</text><text x="720" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Journals + outbox + keys</text></g><g><rect x="980" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="1180" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Kafka / Redpanda</text><text x="1180" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Stable event identities</text></g><text x="60" y="585" fill="#bdc8e2" font-size="22">System architecture · Simplified implementation flow</text></g></svg>