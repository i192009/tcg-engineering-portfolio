<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description"><title id="title">AegisAI Platform system architecture</title><desc id="description">API clients call a Go gateway. Redis controls admission, PostgreSQL owns request state and budget reservations, and the gateway routes to AI providers. An outbox publishes Kafka facts; RabbitMQ evaluation workers persist their results in PostgreSQL.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#222b43"/><stop offset=".52" stop-color="#192236"/><stop offset="1" stop-color="#131b2b"/></linearGradient><marker id="direction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8394bd" stroke-width="1.5"/></marker></defs><rect width="1440" height="820" fill="url(#background)"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="60" y="58" fill="#c9c3ff" font-size="25" letter-spacing="2">AEGISAI PLATFORM</text><text x="60" y="112" fill="#f0f3ff" font-size="34" font-weight="600">Tenant policy. Durable effects.</text><path d="M460 236H520" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M920 236H980" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M720 292V336H260V380" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M720 292V380" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M920 436H980" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><path d="M720 580V492" fill="none" stroke="#8394bd" stroke-width="2.5" marker-end="url(#direction)"/><g><rect x="60" y="180" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="260" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">API clients</text><text x="260" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Tenant API keys</text></g><g><rect x="520" y="180" width="400" height="112" rx="17" fill="#303958" stroke="#bcb5ff" stroke-width="2"/><text x="720" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Go gateway</text><text x="720" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Policy + provider routing</text></g><g><rect x="980" y="180" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="1180" y="225" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">AI providers</text><text x="1180" y="261" text-anchor="middle" fill="#c1cce6" font-size="24">Completion + bounded SSE</text></g><g><rect x="60" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="260" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Redis</text><text x="260" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Admission + concurrency</text></g><g><rect x="520" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="720" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">PostgreSQL</text><text x="720" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Request state + budgets</text></g><g><rect x="980" y="380" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="1180" y="425" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Outbox / Kafka</text><text x="1180" y="461" text-anchor="middle" fill="#c1cce6" font-size="24">Replayable usage + audit</text></g><g><rect x="520" y="580" width="400" height="112" rx="17" fill="#1e293f" stroke="#61779f" stroke-width="2"/><text x="720" y="625" text-anchor="middle" fill="#f0f3ff" font-size="30" font-weight="500">Evaluation</text><text x="720" y="661" text-anchor="middle" fill="#c1cce6" font-size="24">RabbitMQ + Go workers</text></g><text x="60" y="785" fill="#bdc8e2" font-size="22">System architecture · Simplified implementation flow</text></g></svg>